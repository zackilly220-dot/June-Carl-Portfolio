<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070907">
  <title>Calculator — June Carl Andrew Fiel</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #070907;
      --surface: #121710;
      --surface-raised: #1a2117;
      --ink: #f3f7ef;
      --muted: #a5b09d;
      --line: #293328;
      --neon: #a5ff00;
      --neon-soft: #1e2c14;
      --danger: #ff817d;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 0, rgba(91, 150, 21, .13), transparent 48%), var(--background);
      color: var(--ink);
      font: 16px/1.5 "Segoe UI", Arial, sans-serif;
    }
    a { color: inherit; }
    .page { width: min(100%, 410px); }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; text-decoration: none; }
    .brand-mark { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 50%; background: var(--neon); color: #101607; }
    .back-link { color: var(--muted); font-size: 12px; text-decoration: none; }
    .back-link:hover { color: var(--neon); }
    .calculator { padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(160deg, rgba(165,255,0,.035), transparent 35%), var(--surface); box-shadow: 0 24px 80px rgba(0,0,0,.42); }
    .eyebrow { margin: 0 0 5px; color: var(--neon); font-size: 10px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 27px; letter-spacing: -.04em; }
    .screen { min-height: 112px; display: flex; flex-direction: column; justify-content: end; align-items: end; gap: 7px; margin: 22px 0 14px; padding: 16px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: #080b07; text-align: right; }
    .expression { min-height: 20px; width: 100%; overflow: hidden; color: var(--muted); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .display { width: 100%; overflow: hidden; color: var(--ink); font-size: clamp(32px, 11vw, 46px); font-variant-numeric: tabular-nums; font-weight: 650; letter-spacing: -.045em; text-overflow: ellipsis; white-space: nowrap; }
    .status { min-height: 20px; margin: 0 0 12px; color: var(--muted); font-size: 11px; }
    .status.error { color: var(--danger); }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .key {
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-raised);
      color: var(--ink);
      cursor: pointer;
      font-size: 19px;
      font-weight: 600;
      transition: border-color .15s, background .15s, transform .15s;
    }
    .key:hover { transform: translateY(-1px); border-color: var(--neon); }
    .key:active { transform: translateY(0); }
    .key:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
    .key.utility { color: var(--neon); background: var(--neon-soft); font-size: 15px; }
    .key.operator { color: var(--neon); font-size: 22px; }
    .key.equals { border-color: var(--neon); background: var(--neon); color: #101607; font-size: 23px; }
    .key.equals:hover { background: #b7ff4a; }
    .key.zero { grid-column: span 2; }
    .hint { margin: 16px 0 0; color: var(--muted); font-size: 11px; text-align: center; }

    @media (max-width: 380px) {
      .calculator { padding: 18px; }
      .keys { gap: 8px; }
      .key { min-height: 54px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">J</span><span>June Carl Andrew Fiel</span></a>
      <a class="back-link" href="../index.html">← Portfolio</a>
    </header>

    <section class="calculator" aria-labelledby="calculator-title">
      <p class="eyebrow">Quick tool</p>
      <h1 id="calculator-title">Calculator</h1>
      <div class="screen" aria-label="Calculator display">
        <div class="expression" id="expression" aria-hidden="true"></div>
        <output class="display" id="display" aria-live="polite" aria-atomic="true">0</output>
      </div>
      <p class="status" id="status" role="status" aria-live="polite">Use the buttons or your keyboard.</p>

      <div class="keys" id="keys" aria-label="Calculator keys">
        <button class="key utility" type="button" data-action="clear" aria-label="All clear">AC</button>
        <button class="key utility" type="button" data-action="backspace" aria-label="Delete last digit">DEL</button>
        <button class="key utility" type="button" data-action="percent" aria-label="Percent">%</button>
        <button class="key operator" type="button" data-operator="/" aria-label="Divide">÷</button>

        <button class="key" type="button" data-digit="7">7</button>
        <button class="key" type="button" data-digit="8">8</button>
        <button class="key" type="button" data-digit="9">9</button>
        <button class="key operator" type="button" data-operator="*" aria-label="Multiply">×</button>

        <button class="key" type="button" data-digit="4">4</button>
        <button class="key" type="button" data-digit="5">5</button>
        <button class="key" type="button" data-digit="6">6</button>
        <button class="key operator" type="button" data-operator="-" aria-label="Subtract">−</button>

        <button class="key" type="button" data-digit="1">1</button>
        <button class="key" type="button" data-digit="2">2</button>
        <button class="key" type="button" data-digit="3">3</button>
        <button class="key operator" type="button" data-operator="+" aria-label="Add">+</button>

        <button class="key utility" type="button" data-action="sign" aria-label="Change sign">±</button>
        <button class="key zero" type="button" data-digit="0">0</button>
        <button class="key" type="button" data-action="decimal" aria-label="Decimal point">.</button>
        <button class="key equals" type="button" data-action="equals" aria-label="Equals">=</button>
      </div>
      <p class="hint">Keyboard: 0–9, + − × ÷, Enter, Backspace, Esc</p>
    </section>
  </main>

  <script>
    const display = document.getElementById("display");
    const expression = document.getElementById("expression");
    const status = document.getElementById("status");
    let displayValue = "0";
    let firstOperand = null;
    let operator = null;
    let awaitingOperand = false;

    const operatorLabels = { "+": "+", "-": "−", "*": "×", "/": "÷" };
    const operationNames = { "+": "add", "-": "subtract", "*": "multiply", "/": "divide" };

    function render() {
      display.textContent = displayValue;
    }

    function clearStatus() {
      status.textContent = "Use the buttons or your keyboard.";
      status.classList.remove("error");
    }

    function showError(message) {
      status.textContent = message;
      status.classList.add("error");
    }

    function formatNumber(value) {
      if (!Number.isFinite(value)) throw new Error("The result is outside the calculator’s number range.");
      return String(Number(value.toPrecision(12)));
    }

    function calculateLocally(left, right, operation) {
      switch (operation) {
        case "add": return left + right;
        case "subtract": return left - right;
        case "multiply": return left * right;
        case "divide":
          if (right === 0) throw new Error("Cannot divide by zero.");
          return left / right;
        default: throw new Error("That operation is not supported.");
      }
    }

    function calculate(left, right, symbol) {
      const operation = operationNames[symbol];
      status.textContent = "Calculated in your browser.";
      return calculateLocally(left, right, operation);
    }

    function enterDigit(digit) {
      clearStatus();
      displayValue = awaitingOperand || displayValue === "0" ? digit : displayValue + digit;
      awaitingOperand = false;
      render();
    }

    function enterDecimal() {
      clearStatus();
      if (awaitingOperand) {
        displayValue = "0.";
        awaitingOperand = false;
      } else if (!displayValue.includes(".")) {
        displayValue += ".";
      }
      render();
    }

    async function chooseOperator(nextOperator) {
      clearStatus();
      try {
        if (operator && firstOperand !== null && !awaitingOperand) {
          firstOperand = Number(formatNumber(await calculate(firstOperand, Number(displayValue), operator)));
          displayValue = String(firstOperand);
        } else if (firstOperand === null) {
          firstOperand = Number(displayValue);
        }
        operator = nextOperator;
        awaitingOperand = true;
        expression.textContent = `${displayValue} ${operatorLabels[operator]}`;
        render();
      } catch (error) {
        showError(error.message);
      }
    }

    async function equals() {
      clearStatus();
      if (operator === null || firstOperand === null || awaitingOperand) return;
      const left = firstOperand;
      const right = Number(displayValue);
      const currentOperator = operator;
      try {
        const result = formatNumber(await calculate(left, right, currentOperator));
        expression.textContent = `${left} ${operatorLabels[currentOperator]} ${right} =`;
        displayValue = result;
        firstOperand = null;
        operator = null;
        awaitingOperand = true;
        render();
      } catch (error) {
        showError(error.message);
      }
    }

    function clearAll() {
      displayValue = "0";
      firstOperand = null;
      operator = null;
      awaitingOperand = false;
      expression.textContent = "";
      clearStatus();
      render();
    }

    function backspace() {
      clearStatus();
      if (awaitingOperand) return;
      displayValue = displayValue.length > 1 ? displayValue.slice(0, -1) : "0";
      if (displayValue === "-") displayValue = "0";
      render();
    }

    function changeSign() {
      clearStatus();
      if (displayValue !== "0") displayValue = displayValue.startsWith("-") ? displayValue.slice(1) : `-${displayValue}`;
      render();
    }

    function percent() {
      clearStatus();
      displayValue = formatNumber(Number(displayValue) / 100);
      render();
    }

    document.getElementById("keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      else if (button.dataset.operator) chooseOperator(button.dataset.operator);
      else if (button.dataset.action === "clear") clearAll();
      else if (button.dataset.action === "backspace") backspace();
      else if (button.dataset.action === "decimal") enterDecimal();
      else if (button.dataset.action === "sign") changeSign();
      else if (button.dataset.action === "percent") percent();
      else if (button.dataset.action === "equals") equals();
    });

    document.addEventListener("keydown", (event) => {
      if (/^\d$/.test(event.key)) enterDigit(event.key);
      else if (event.key === ".") enterDecimal();
      else if (["+", "-", "*", "/"].includes(event.key)) chooseOperator(event.key);
      else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        equals();
      } else if (event.key === "Backspace") backspace();
      else if (event.key === "Escape") clearAll();
      else if (event.key === "%") percent();
    });
  </script>
</body>
</html>
